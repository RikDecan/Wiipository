services:
  backend:
    build:
      context: ./backend
    volumes:
      - ./backend/data:/app/data
    environment:
      PORT: 3001
      FRONTEND_URL: http://localhost:8080
    restart: unless-stopped

  frontend:
    build:
      context: ./app
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
